<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagaar · Monthly payday planner</title>
<meta name="theme-color" content="#1B2A4E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#1B2A4E; --ink-soft:#5A6683; --line:#D6DDE6;
  --marigold:#D98E04; --marigold-soft:#FCEFD3; --paid:#21745A; --paid-soft:#DCF0E7;
  --due:#B3312A; --due-soft:#F8E1DE; --track:#DFE5EC; --focus:#3B6FE0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1530; --surface:#172140; --ink:#E5EAF5; --ink-soft:#9AA6C3; --line:#2A3760;
    --marigold:#F0B23A; --marigold-soft:#3A2E10; --paid:#4DC293; --paid-soft:#11352A;
    --due:#F1776B; --due-soft:#3E1B18; --track:#24305A; --focus:#7FA4FF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1530; --surface:#172140; --ink:#E5EAF5; --ink-soft:#9AA6C3; --line:#2A3760;
  --marigold:#F0B23A; --marigold-soft:#3A2E10; --paid:#4DC293; --paid-soft:#11352A;
  --due:#F1776B; --due-soft:#3E1B18; --track:#24305A; --focus:#7FA4FF; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px}
.brand{font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-weight:500;font-size:14px;color:var(--ink-soft);letter-spacing:0;margin-top:6px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink-soft);text-align:left}
nav button svg{width:22px;height:22px;flex:none}
nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--marigold)}
main{padding:32px clamp(16px,4vw,48px) 48px;max-width:820px;width:100%}
.topbar{display:none}

h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.015em}
h2{font-size:20px;margin:34px 0 12px;font-weight:700}
.lede{color:var(--ink-soft);margin:0 0 22px}
.muted{color:var(--ink-soft)}

/* The salary ribbon */
.ribbon-wrap{position:relative;margin:4px 0 14px}
.ribbon{display:flex;height:46px;border-radius:8px;overflow:hidden;background:var(--track)}
.seg{height:100%;border-right:2px solid var(--paper);min-width:3px}
.seg:last-child{border-right:0}
.seg.is-paid{background:var(--paid)}
.seg.is-pending{background:repeating-linear-gradient(135deg,var(--marigold) 0 7px,color-mix(in srgb,var(--marigold) 72%,var(--paper)) 7px 12px)}
.seg.is-left{background:transparent}
.over-mark{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--due);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px}
.legend b{font-weight:700}
.sw{width:14px;height:14px;border-radius:3px;flex:none}
.sw.p{background:var(--paid)} .sw.q{background:var(--marigold)} .sw.l{background:var(--track);outline:1px solid var(--line)}

/* Alerts */
.alerts{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface);border-left:4px solid var(--line)}
.alert.due{border-left-color:var(--due);background:var(--due-soft)}
.alert.soon{border-left-color:var(--marigold);background:var(--marigold-soft)}
.alert.info{border-left-color:var(--ink-soft)}
.alert p{margin:0;flex:1}
.alert button{flex:none}

/* Rows */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto 40px;align-items:center;gap:6px;padding:10px 8px 10px 6px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-name{font-weight:600;line-height:1.2}
.row-meta{font-size:14px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.row.paid .row-name{color:var(--ink-soft)}
.row.paid .amt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--paid) 60%,transparent)}
.tag{display:inline-block;font-size:13px;padding:0 7px;border-radius:20px;background:var(--paper);color:var(--ink-soft);margin-right:4px}
.tag.warn{background:var(--marigold-soft);color:var(--ink)}
.tag.ok{background:var(--paid-soft);color:var(--paid)}
.amt{font-weight:700;white-space:nowrap}
.amt-in{width:112px;text-align:right;font-weight:700;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.needs .amt-in{border-color:var(--marigold);background:var(--marigold-soft)}
.check{display:grid;place-items:center;width:44px;height:44px;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink-soft);display:grid;place-items:center;transition:background .15s}
.check input:checked + .box{background:var(--paid);border-color:var(--paid)}
.check input:checked + .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:2px}
.check input:disabled + .box{opacity:.5}
.more{border:0;background:none;width:40px;height:40px;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:22px;line-height:1}
.more:hover{background:var(--paper)}
.linkish{border:0;background:none;padding:0;color:var(--marigold);font-weight:700;cursor:pointer;font-size:14px;text-decoration:underline}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--due);border-color:color-mix(in srgb,var(--due) 45%,var(--line))}
.btn.small{padding:5px 12px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:600;font-size:15px}
.field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);width:100%}
.field .hint{font-size:14px;color:var(--ink-soft)}
.seg-ctl{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg-ctl label{flex:1;text-align:center;padding:9px 6px;cursor:pointer;font-weight:500;font-size:15px}
.seg-ctl input{position:absolute;opacity:0}
.seg-ctl input:checked + span{font-weight:700}
.seg-ctl label:has(input:checked){background:var(--ink);color:var(--paper)}
.seg-ctl label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-3px}

/* Month view */
.month-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.month-head h1{flex:1;margin:0}
.navbtn{border:1.5px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:20px}
.navbtn:disabled{opacity:.35;cursor:default}
.salary-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0}
.salary-row label{font-weight:700;flex:1;min-width:140px}
.salary-row input{width:170px;font-size:20px;font-weight:800;text-align:right;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper)}
.sums{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.sums div{background:var(--surface);padding:10px 12px}
.sums span{display:block;font-size:14px;color:var(--ink-soft)}
.sums b{font-size:19px;font-weight:800}
.sums .neg{color:var(--due)}
.closed-note{background:var(--paid-soft);color:var(--ink);padding:10px 14px;border-radius:10px;margin:0 0 14px}

/* History */
.hist{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .hist:first-child{border-top:0}
.hist:hover{background:var(--paper)}
.hbar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px;display:flex}
.hbar i{display:block;height:100%;background:var(--ink)}
.hbar i.over{background:var(--due)}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center}
.group-h{font-size:15px;color:var(--ink-soft);font-weight:600;margin:20px 0 8px}

dialog{border:0;border-radius:16px;padding:0;width:min(460px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,50,.35)}
dialog::backdrop{background:rgba(14,21,48,.55)}
.dlg{padding:22px}
.dlg h3{margin:0 0 16px;font-size:21px}
.dlg .actions{justify-content:flex-end}
.dlg .actions .spacer{flex:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.settings-block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.settings-block h3{margin:0 0 6px;font-size:18px}
.settings-block p{margin:0 0 10px}
.steps{margin:8px 0 0;padding-left:20px;color:var(--ink-soft);font-size:15px}

@media (max-width:760px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface);z-index:20;flex-direction:row}
  .side .brand{display:none}
  nav{flex-direction:row;width:100%;gap:0}
  nav button{flex:1;flex-direction:column;gap:2px;font-size:12px;padding:8px 2px;text-align:center;border-radius:8px}
  nav button[aria-current="page"]{box-shadow:inset 0 3px 0 var(--marigold);background:none}
  .topbar{display:flex;align-items:baseline;gap:10px;padding:14px 16px 0}
  .topbar .brand{font-size:22px}
  main{padding:14px 14px 110px}
  .sums{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:44px 1fr auto 36px;gap:4px}
  .amt-in{width:96px;padding:6px 8px}
  .salary-row input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Pagaar<small>Monthly payday planner</small></div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <div>
    <div class="topbar"><span class="brand">Pagaar</span><span class="muted" id="topSub"></span></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const STORE='pagaar.v1';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ICONS={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
 month:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4"/></svg>',
 items:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M18 15l2 2-2 2"/></svg>',
 history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};
const TABS=[['home','Overview'],['month','Month'],['items','Recurring'],['history','History'],['settings','Settings']];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const parseKey=k=>{const [y,m]=k.split('-').map(Number);return {y,m};};
const addMonths=(k,n)=>{const {y,m}=parseKey(k);return keyOf(new Date(y,m-1+n,1));};
const lastDay=k=>{const {y,m}=parseKey(k);return new Date(y,m,0);};
const windowEnd=k=>{const {y,m}=parseKey(k);return new Date(y,m,1);};
const monthName=k=>{const {y,m}=parseKey(k);return MONTHS[m-1]+' '+y;};
const shortMonth=k=>{const {y,m}=parseKey(k);return MONTHS[m-1].slice(0,3)+' '+y;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtDay=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const sum=a=>a.reduce((t,e)=>t+(Number(e.amount)||0),0);
function currentCycle(){const t=today();return t.getDate()===1?addMonths(keyOf(t),-1):keyOf(t);}
function parseAmount(v){
  const s=String(v).replace(/[₹,\s]/g,'');
  if(s==='') return null;
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  const n=Number(s); return n>1e10?NaN:n;
}

/* ---------- state ---------- */
function defaultState(){
  const start=currentCycle();
  const mk=(name,type,amount)=>({id:uid(),name,type,amount,freq:'monthly',yearMonth:null,startMonth:start,endMonth:null});
  return {version:1,
    settings:{defaultSalary:null,theme:'system',remindTime:'09:00',notify:false,lastBackup:null,lastNotified:null},
    items:[mk('Home Loan','fixed',40200),mk('Personal Loan','fixed',6741),mk('Mutual Fund SIP','fixed',1000),
      mk('Internet','fixed',1000),mk('Maintenance','variable',2500),mk('Credit Card Bill','variable',15000),mk('Light Bill','variable',3500)],
    months:{}};
}
function load(){
  try{const raw=localStorage.getItem(STORE); if(raw){const d=JSON.parse(raw); if(valid(d)) return d;}}catch(e){}
  return defaultState();
}
function valid(d){return d&&typeof d==='object'&&Array.isArray(d.items)&&d.months&&typeof d.months==='object'&&d.settings;}
let saveFailed=false;
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(S));saveFailed=false;}
  catch(e){if(!saveFailed){saveFailed=true;toast('Could not save on this device. Download a backup from Settings.');}}
}
let S=load();
let view='home';
let viewMonth=currentCycle();

/* ---------- month logic ---------- */
function itemActive(it,k){
  if(it.startMonth&&k<it.startMonth) return false;
  if(it.endMonth&&k>it.endMonth) return false;
  if(it.freq==='yearly') return Number(k.slice(5))===Number(it.yearMonth);
  return true;
}
function lastAmount(itemId,before){
  const keys=Object.keys(S.months).filter(k=>k<before).sort().reverse();
  for(const k of keys){const e=S.months[k].entries.find(x=>x.itemId===itemId); if(e) return e.amount;}
  return null;
}
function entryFrom(it,k){
  const last=it.type==='variable'?lastAmount(it.id,k):null;
  return {id:uid(),itemId:it.id,name:it.name,type:it.type,freq:it.freq,amount:last??it.amount,
    confirmed:it.type==='fixed',paid:false,paidDate:null,note:'',oneTime:false};
}
function ensureMonth(k){
  if(!S.months[k]){
    S.months[k]={salary:S.settings.defaultSalary??null,entries:S.items.filter(it=>itemActive(it,k)).map(it=>entryFrom(it,k)),skipped:[],closed:false};
    save();
  }
  return S.months[k];
}
function syncMonth(k){
  const m=S.months[k]; if(!m||m.closed) return 0;
  let n=0; const act=S.items.filter(it=>itemActive(it,k)); const ids=new Set(act.map(i=>i.id));
  m.entries=m.entries.filter(e=>{if(e.oneTime||e.paid||ids.has(e.itemId)) return true; n++; return false;});
  act.forEach(it=>{
    if(m.skipped.includes(it.id)) return;
    const e=m.entries.find(x=>x.itemId===it.id);
    if(!e){m.entries.push(entryFrom(it,k));n++;return;}
    if(e.paid) return;
    if(e.name!==it.name){e.name=it.name;n++;}
    if(e.type!==it.type){e.type=it.type;e.confirmed=it.type==='fixed';n++;}
    if(it.type==='fixed'&&e.amount!==it.amount){e.amount=it.amount;n++;}
  });
  return n;
}
function syncOpenMonths(){let n=0;Object.keys(S.months).filter(k=>k>=currentCycle()).forEach(k=>n+=syncMonth(k));return n;}
function totals(m){
  const total=sum(m.entries), paid=sum(m.entries.filter(e=>e.paid));
  const salary=Number(m.salary)||0;
  return {total,paid,pending:total-paid,salary,hasSalary:m.salary!=null&&m.salary!=='',balance:salary-total};
}
function getEntry(id){const m=S.months[viewMonth];return m&&m.entries.find(e=>e.id===id);}

/* ---------- alerts ---------- */
function alerts(){
  const out=[]; const t=today(); const k=currentCycle(); const m=ensureMonth(k); const T=totals(m);
  Object.keys(S.months).filter(x=>x<k).sort().forEach(x=>{
    const mm=S.months[x]; if(mm.closed) return; const p=mm.entries.filter(e=>!e.paid);
    if(p.length) out.push({lvl:'due',text:`Overdue: ${p.length} unpaid from ${monthName(x)} (${inr(sum(p))}).`,act:'open',arg:x,label:'Review'});
  });
  const pend=m.entries.filter(e=>!e.paid); const ld=lastDay(k), we=windowEnd(k);
  if(pend.length&&!m.closed){
    if(t>=ld&&t<=we){
      out.push({lvl:'due',text:`Payment day. ${pend.length} ${pend.length===1?'payment':'payments'} still to make (${inr(sum(pend))}). Pay by ${fmtDay(we)}.`,act:'open',arg:k,label:'Pay now'});
    }else{
      const days=Math.round((ld-t)/864e5);
      if(days<=5) out.push({lvl:'soon',text:`Salary day is in ${days} ${days===1?'day':'days'} (${fmtDay(ld)}). ${pend.length} payments lined up.`});
    }
  }
  if(!T.hasSalary) out.push({lvl:'soon',text:`Enter your ${MONTHS[parseKey(k).m-1]} salary to see the balance.`,act:'open',arg:k,label:'Add salary'});
  const unc=pend.filter(e=>e.type==='variable'&&!e.confirmed);
  if(unc.length) out.push({lvl:'soon',text:`Check this month's actual amount for ${unc.map(e=>e.name).join(', ')} and tap Confirm amount.`,act:'open',arg:k,label:'Review'});
  if(T.hasSalary&&T.balance<0) out.push({lvl:'due',text:`Expenses are ${inr(-T.balance)} more than the salary this month.`});
  S.items.filter(it=>it.endMonth===k&&it.freq==='monthly').forEach(it=>out.push({lvl:'info',text:`This is the last payment for ${it.name}. It drops off from next month.`}));
  const nk=addMonths(k,1);
  S.items.filter(it=>it.freq==='yearly'&&itemActive(it,nk)).forEach(it=>out.push({lvl:'info',text:`Heads-up: ${it.name} (yearly, about ${inr(it.amount)}) is due next month.`}));
  const lb=S.settings.lastBackup;
  if(Object.keys(S.months).length&&(!lb||(Date.now()-lb)>30*864e5)) out.push({lvl:'info',text:lb?`Last backup was ${Math.floor((Date.now()-lb)/864e5)} days ago.`:'You have not made a backup yet.',act:'backup',label:'Back up'});
  return out;
}

/* ---------- rendering ---------- */
function renderNav(){
  $('#nav').innerHTML=TABS.map(([v,l])=>`<button data-act="nav" data-arg="${v}" ${view===v?'aria-current="page"':''}>${ICONS[v]}<span>${l}</span></button>`).join('');
  $('#topSub').textContent=monthName(currentCycle())+' cycle';
}
function ribbon(m){
  const T=totals(m); const scale=Math.max(T.salary,T.total)||1;
  const ordered=[...m.entries.filter(e=>e.paid),...m.entries.filter(e=>!e.paid)].filter(e=>e.amount>0);
  let segs=ordered.map(e=>`<span class="seg ${e.paid?'is-paid':'is-pending'}" style="width:${(e.amount/scale*100).toFixed(3)}%" title="${esc(e.name)}: ${inr(e.amount)}${e.paid?', paid':''}"></span>`).join('');
  if(T.salary>T.total) segs+=`<span class="seg is-left" style="width:${((T.salary-T.total)/scale*100).toFixed(3)}%" title="Left: ${inr(T.salary-T.total)}"></span>`;
  const over=T.hasSalary&&T.total>T.salary?`<span class="over-mark" style="left:${(T.salary/scale*100).toFixed(2)}%" title="Salary ends here"></span>`:'';
  return `<div class="ribbon-wrap"><div class="ribbon" role="img" aria-label="Salary ${inr(T.salary)}: paid ${inr(T.paid)}, pending ${inr(T.pending)}, left ${inr(Math.max(T.balance,0))}">${segs}</div>${over}</div>
  <ul class="legend"><li><span class="sw p"></span>Paid <b>${inr(T.paid)}</b></li><li><span class="sw q"></span>To pay <b>${inr(T.pending)}</b></li>${T.hasSalary?`<li><span class="sw l"></span>${T.balance<0?'Short by':'Left'} <b>${inr(Math.abs(T.balance))}</b></li>`:''}</ul>`;
}
function renderHome(){
  const k=currentCycle(); const m=ensureMonth(k); const T=totals(m); const pend=m.entries.filter(e=>!e.paid);
  const head=!T.hasSalary?'Add your salary to see what is left this month'
    :T.balance>=0?`${inr(T.balance)} left after this month's payments`:`${inr(-T.balance)} short this month`;
  const al=alerts();
  return `<h1>${head}</h1>
  <p class="lede">${monthName(k)} salary, credited ${fmtDay(lastDay(k))}. Pay everything by ${fmtDay(windowEnd(k))}.</p>
  ${ribbon(m)}
  ${al.length?`<ul class="alerts">${al.map(a=>`<li class="alert ${a.lvl}"><p>${esc(a.text)}</p>${a.act?`<button class="btn small" data-act="${a.act}" data-arg="${a.arg||''}">${a.label}</button>`:''}</li>`).join('')}</ul>`:''}
  <h2>${pend.length?'Still to pay':'Payments'}</h2>
  ${pend.length?`<ul class="list">${pend.map(e=>rowHTML(e,m,true)).join('')}</ul>`

    :`<div class="empty"><p>No payments for this month yet.</p><button class="btn primary" data-act="addOne">Add a payment</button></div>`}
  <div class="actions"><button class="btn" data-act="open" data-arg="${k}">Open full month</button><button class="btn" data-act="addOne">Add one-time payment</button></div>`;
}
function rowHTML(e,m,compact){
  const locked=m.closed; const needs=e.type==='variable'&&!e.confirmed&&!e.paid;
  const tags=[];
  if(e.oneTime) tags.push('<span class="tag">One-time</span>');
  else if(e.freq==='yearly') tags.push('<span class="tag">Yearly</span>');
  else tags.push(`<span class="tag">${e.type==='fixed'?'Fixed':'Varies'}</span>`);
  if(e.paid) tags.push(`<span class="tag ok">Paid ${e.paidDate?fmtDay(fromIso(e.paidDate)):''}</span>`);
  const meta=tags.join('')+(needs?` <button class="linkish" data-act="confirm" data-arg="${e.id}">Confirm amount</button>`:'')+(e.note?` <span>${esc(e.note)}</span>`:'');
  const amt=(e.paid||locked)?`<span class="amt">${inr(e.amount)}</span>`
    :`<input class="amt-in" inputmode="decimal" value="${e.amount}" data-change="amount" data-arg="${e.id}" aria-label="Amount for ${esc(e.name)}">`;
  return `<li class="row ${e.paid?'paid':''} ${needs?'needs':''}">
    <label class="check" title="${e.paid?'Mark as unpaid':'Mark as paid'}"><input type="checkbox" data-change="paid" data-arg="${e.id}" ${e.paid?'checked':''} ${locked?'disabled':''} aria-label="Paid: ${esc(e.name)}"><span class="box"></span></label>

    <div>${amt}</div>

}
function renderMonth(){
  const k=viewMonth; const m=S.months[k]; const cur=currentCycle();

  <p class="lede">Salary on ${fmtDay(lastDay(k))}, pay by ${fmtDay(windowEnd(k))}${k===cur?' (current)':k>cur?' (planning ahead)':''}.</p>`;

  <div class="sums"><div><span>Total expenses</span><b>${inr(T.total)}</b></div><div><span>Paid</span><b>${inr(T.paid)}</b></div><div><span>To pay</span><b>${inr(T.pending)}</b></div><div><span>${T.balance<0?'Short by':'Balance'}</span><b class="${T.balance<0?'neg':''}">${T.hasSalary?inr(Math.abs(T.balance)):'Add salary'}</b></div></div>

  <h2>Payments (${m.entries.filter(e=>e.paid).length} of ${m.entries.length} paid)</h2>
  ${m.entries.length?`<ul class="list">${m.entries.map(e=>rowHTML(e,m)).join('')}</ul>`:`<div class="empty">No payments in this month.</div>`}

    <button class="btn" data-act="addOne">Add one-time payment</button>
    <button class="btn" data-act="sync">Refresh from recurring list</button>

function describeItem(it){
  const p=[];
  p.push(it.type==='fixed'?'Fixed':'Varies');
  if(it.freq==='yearly') p.push('every '+MONTHS[it.yearMonth-1]);
  if(it.endMonth) p.push((it.endMonth<currentCycle()?'ended ':'last payment ')+shortMonth(it.endMonth));
  if(it.startMonth>currentCycle()) p.push('starts '+shortMonth(it.startMonth));
  return p.join(', ');
}
function renderItems(){
  const cur=currentCycle();
  const ended=S.items.filter(i=>i.endMonth&&i.endMonth<cur);
  const monthly=S.items.filter(i=>i.freq==='monthly'&&!ended.includes(i));
  const yearly=S.items.filter(i=>i.freq==='yearly'&&!ended.includes(i));
  const list=a=>`<ul class="list">${a.map(it=>`<li class="row" style="grid-template-columns:1fr auto 40px;padding-left:16px"><div><div class="row-name">${esc(it.name)}</div><div class="row-meta">${esc(describeItem(it))}</div></div><span class="amt">${inr(it.amount)}</span><button class="more" data-act="item" data-arg="${it.id}" aria-label="Edit ${esc(it.name)}">⋯</button></li>`).join('')}</ul>`;
  const mt=sum(monthly.filter(i=>itemActive(i,cur)));
  return `<h1>Recurring payments</h1>
  <p class="lede">These build each new month automatically. Fixed amounts copy as they are. Varying amounts start from last month's figure and wait for you to confirm.</p>
  <div class="actions" style="margin:0 0 6px"><button class="btn primary" data-act="item" data-arg="">Add recurring payment</button></div>
  <p class="group-h">Every month (${inr(mt)} at current amounts)</p>
  ${monthly.length?list(monthly):'<div class="empty">No monthly payments.</div>'}
  <p class="group-h">Once a year</p>
  ${yearly.length?list(yearly):`<div class="empty"><p class="muted">Add things like property tax or insurance here. They appear only in their month.</p></div>`}
  ${ended.length?`<p class="group-h">Finished</p>${list(ended)}`:''}`;
}
function renderHistory(){
  const keys=Object.keys(S.months).sort().reverse();
  if(!keys.length) return `<h1>History</h1><div class="empty">Months appear here once you start using the planner.</div>`;
  const rows=keys.map(k=>{const m=S.months[k],T=totals(m),p=m.entries.filter(e=>!e.paid).length;
    const pct=T.salary?Math.min(T.total/T.salary*100,100):0;
    return `<button class="hist" data-act="open" data-arg="${k}"><b>${monthName(k)}</b><b>${T.hasSalary?(T.balance<0?'−':'')+inr(Math.abs(T.balance)):'No salary'}</b>
      <span class="muted">Spent ${inr(T.total)}${T.hasSalary?' of '+inr(T.salary):''}</span><span class="muted">${p?p+' unpaid':m.closed?'Complete':'All paid'}</span>
      <span class="hbar"><i class="${T.total>T.salary?'over':''}" style="width:${T.hasSalary?pct:0}%"></i></span></button>`;}).join('');
  const withSal=keys.filter(k=>totals(S.months[k]).hasSalary);
  const avg=withSal.length?withSal.reduce((t,k)=>t+totals(S.months[k]).total,0)/withSal.length:0;
  return `<h1>History</h1><p class="lede">${keys.length} ${keys.length===1?'month':'months'} recorded${withSal.length?`. Average spend ${inr(Math.round(avg))} a month`:''}.</p><div class="list">${rows}</div>`;
}

function itemSave(id){
  const name=$('#f-name').value.trim(); const amt=parseAmount($('#f-amt').value);

/* ---------- actions ---------- */
const A={
  nav:v=>{viewMonth=currentCycle(); go(v);},
  open:k=>{viewMonth=k||currentCycle(); ensureMonthIfCurrent(viewMonth); go('month');},
  mprev:()=>{viewMonth=addMonths(viewMonth,-1);render();},
  mnext:()=>{viewMonth=addMonths(viewMonth,1);render();},
  create:k=>{ensureMonth(k);render();},
  confirm:id=>{const e=getEntry(id)||findAnyEntry(id);if(!e)return;e.confirmed=true;save();render();toast(`${e.name} confirmed at ${inr(e.amount)}.`);},
  entry:id=>entryDialog(id),
  entrySave:id=>{const e=getEntry(id);if(!e)return;
    if(!e.paid){const a=parseAmount($('#e-amt').value);if(a===null||isNaN(a))return toast('Enter an amount in rupees, like 2500.');if(a!==e.amount){e.amount=a;}e.confirmed=true;}
    if(e.oneTime){const n=$('#e-name').value.trim();if(!n)return toast('Enter a name.');e.name=n;}
    if(e.paid&&$('#e-date').value) e.paidDate=$('#e-date').value;
    e.note=$('#e-note').value.trim();save();closeDlg();render();toast('Saved.');},
  entryDel:id=>{const m=S.months[viewMonth];const e=getEntry(id);if(!e)return;
    if(!confirm(e.oneTime?`Remove ${e.name} from ${monthName(viewMonth)}?`:`Skip ${e.name} for ${monthName(viewMonth)} only? It stays in your recurring list.`))return;
    m.entries=m.entries.filter(x=>x.id!==id); if(!e.oneTime&&e.itemId) m.skipped.push(e.itemId);
    save();closeDlg();render();toast(e.oneTime?'Removed.':'Skipped for this month.');},
  addOne:()=>{if(view!=='month') viewMonth=currentCycle(); const m=S.months[viewMonth]; if(m&&m.closed) return toast('Reopen this month first.'); oneDialog();},
  oneSave:()=>{const name=$('#o-name').value.trim();const a=parseAmount($('#o-amt').value);
    if(!name) return toast('Enter a name for the payment.'); if(a===null||isNaN(a)) return toast('Enter an amount in rupees, like 2500.');
    const m=ensureMonth(viewMonth); m.entries.push({id:uid(),itemId:null,name,type:'fixed',freq:'once',amount:a,confirmed:true,paid:false,paidDate:null,note:$('#o-note').value.trim(),oneTime:true});
    save();closeDlg();render();toast(`Added ${name} to ${monthName(viewMonth)}.`);},
  sync:()=>{const m=S.months[viewMonth]; m.skipped=[]; const n=syncMonth(viewMonth); save(); render(); toast(n?`${n} ${n===1?'change':'changes'} applied from the recurring list.`:'Already up to date.');},
  close:()=>{const m=S.months[viewMonth];const p=m.entries.filter(e=>!e.paid);
    if(p.length&&!confirm(`${p.length} ${p.length===1?'payment is':'payments are'} not marked paid (${p.map(e=>e.name).join(', ')}). Mark the month complete anyway?`)) return;
    m.closed=true;save();render();toast(`${monthName(viewMonth)} marked complete.`);},
  reopen:()=>{S.months[viewMonth].closed=false;save();render();toast('Month reopened.');},
  item:id=>itemDialog(id),
  itemSave:id=>itemSave(id),
  itemDel:id=>{const it=S.items.find(i=>i.id===id);if(!confirm(`Delete ${it.name}? Past months keep their records. To stop an EMI instead, set its last month.`))return;
    S.items=S.items.filter(i=>i.id!==id);syncOpenMonths();save();closeDlg();render();toast('Deleted.');},
  dlgClose:()=>closeDlg(),
  ics:()=>{download(`pagaar-reminders.ics`,buildICS(),'text/calendar');toast('Reminder file downloaded.');},
  backup:()=>{S.settings.lastBackup=Date.now();save();download(`pagaar-backup-${iso(today())}.json`,JSON.stringify(S,null,2),'application/json');render();toast('Backup downloaded.');},
  import:()=>$('#importFile').click(),
  notify:async()=>{
    if(S.settings.notify&&Notification.permission==='granted'){S.settings.notify=false;save();render();return toast('Notifications off.');}
    const p=await Notification.requestPermission();
    if(p==='granted'){S.settings.notify=true;save();render();toast('Notifications on.');maybeNotify(true);}
    else toast('Notifications are blocked. Allow them in the browser site settings.');},
  erase:()=>{if(!confirm('Erase all data on this device? Download a backup first if you may need it.'))return;
    if(!confirm('This cannot be undone. Erase everything?'))return;
    S=defaultState();save();viewMonth=currentCycle();go('home');toast('All data erased. Default list restored.');}
};
function ensureMonthIfCurrent(k){if(k===currentCycle()) ensureMonth(k);}
function findAnyEntry(id){for(const k in S.months){const e=S.months[k].entries.find(x=>x.id===id);if(e){viewMonth=k;return e;}}return null;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset.arg);});
document.addEventListener('change',e=>{
  const t=e.target; const c=t.dataset.change; if(!c) return;
  if(c==='paid'){
    const en=getEntry(t.dataset.arg); if(!en) return;
    if(t.checked&&en.type==='variable'&&!en.confirmed&&!confirm(`${en.name} has not been confirmed for this month (${inr(en.amount)}). Mark it paid at this amount?`)){t.checked=false;return;}
    en.paid=t.checked; en.paidDate=t.checked?iso(today()):null; if(t.checked) en.confirmed=true;
    save(); render(); if(t.checked) toast(`${en.name} marked paid.`);
  }else if(c==='amount'){
    const en=getEntry(t.dataset.arg); if(!en) return; const a=parseAmount(t.value);
    if(a===null||isNaN(a)){toast('Enter an amount in rupees, like 2500.');t.value=en.amount;return;}
    en.amount=a; en.confirmed=true; save(); render();
  }else if(c==='salary'){
    const a=parseAmount(t.value); const m=S.months[viewMonth];
    if(a!==null&&isNaN(a)){toast('Enter the salary in rupees, like 75000.');t.value=m.salary??'';return;}
    m.salary=a; if(a!==null&&viewMonth>=currentCycle()) S.settings.defaultSalary=a; save(); render();
  }else if(c==='remindTime'){S.settings.remindTime=t.value||'09:00';save();}
  else if(c==='theme'){S.settings.theme=t.value;applyTheme();save();}
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!valid(d)) throw 0;
      if(!confirm(`Restore this backup? It has ${d.items.length} recurring payments and ${Object.keys(d.months).length} months, and replaces the data on this device.`)) return;
      S=d; save(); applyTheme(); viewMonth=currentCycle(); go('home'); toast('Backup restored.');}
    catch(err){toast('That file is not a Pagaar backup. Choose the .json file you downloaded from Settings.');}
    e.target.value='';};
  r.readAsText(f);
});

/* ---------- files ---------- */
function download(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function fold(line){const out=[];while(line.length>73){out.push(line.slice(0,73));line=' '+line.slice(73);}out.push(line);return out.join('\r\n');}
function buildICS(){
  const [hh,mm]=(S.settings.remindTime||'09:00').split(':');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const dt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${hh}${mm}00`;
  const cur=currentCycle();
  const monthly=S.items.filter(i=>i.freq==='monthly'&&(!i.endMonth||i.endMonth>=cur));
  const listing=monthly.map(i=>`- ${i.name}: ${i.type==='fixed'?inr(i.amount):'about '+inr(i.amount)+' (varies)'}`).join('\n');
  const ev=[];
  const add=(uidp,summary,desc,start,rrule)=>{ev.push(['BEGIN:VEVENT',`UID:${uidp}@pagaar.local`,`DTSTAMP:${stamp}`,`DTSTART:${dt(start)}`,'DURATION:PT30M',
    `SUMMARY:${icsEsc(summary)}`,`DESCRIPTION:${icsEsc(desc)}`,rrule?`RRULE:${rrule}`:null,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(summary)}`,'TRIGGER:PT0M','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(summary)}`,'TRIGGER:-P1D','END:VALARM','END:VEVENT'].filter(Boolean));};
  add('salary-day','Salary day: pay monthly expenses',`Open Pagaar and mark each payment.\n\n${listing}`,lastDay(cur),'FREQ=MONTHLY;BYMONTHDAY=-1');
  add('deadline','Last day to pay this month\'s expenses','Check Pagaar for anything still unpaid.',windowEnd(cur),'FREQ=MONTHLY;BYMONTHDAY=1');
  S.items.filter(i=>i.freq==='yearly').forEach(i=>{
    let k=cur.slice(0,4)+'-'+pad(i.yearMonth); if(k<cur) k=addMonths(k,12);
    add('yearly-'+i.id,`Yearly payment due: ${i.name}`,`About ${inr(i.amount)}. It is in Pagaar's ${MONTHS[i.yearMonth-1]} list.`,lastDay(k),'FREQ=YEARLY');
  });
  S.items.filter(i=>i.endMonth&&i.endMonth>=cur&&i.freq==='monthly').forEach(i=>{
    add('last-'+i.id,`Last payment: ${i.name}`,`Final instalment of ${inr(i.amount)}. It drops off Pagaar after this month.`,lastDay(i.endMonth),null);
  });
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pagaar//Payday planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Pagaar reminders',...ev.flat(),'END:VCALENDAR'];
  return lines.map(fold).join('\r\n')+'\r\n';
}

/* ---------- misc ---------- */
let tt; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
function applyTheme(){const t=S.settings.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;}
async function maybeNotify(force){
  try{
    if(!S.settings.notify||!window.Notification||Notification.permission!=='granted'||!('serviceWorker' in navigator)) return;
    const d=iso(today()); if(!force&&S.settings.lastNotified===d) return;
    const due=alerts().filter(a=>a.lvl==='due'); if(!due.length&&!force) return;
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('Pagaar',{body:due.length?due.map(a=>a.text).join(' '):'Notifications are on. You will hear from Pagaar on payment days.',icon:'icon-192.png',tag:'pagaar'});
    S.settings.lastNotified=d; save();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();maybeNotify();}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

applyTheme(); ensureMonth(currentCycle()); render(); maybeNotify();
})();
</script>
